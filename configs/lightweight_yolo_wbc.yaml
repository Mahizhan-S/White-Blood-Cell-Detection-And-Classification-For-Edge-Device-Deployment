# Hybridised Model 2 — Modified YOLOv11 Architecture 2
# Ultra-lightweight single-scale head design for edge deployment.
# ~0.18M params (-93% vs baseline), 1.5 GFLOPs, mAP50 0.973, 9.1ms inference
#
# Training command:
#   yolo detect train model=configs/lightweight_yolo_wbc.yaml \
#       data=data/wbccd.yaml epochs=500 imgsz=800 batch=16

nc: 5  # basophil, eosinophil, lymphocyte, monocyte, neutrophil
scales:
  n: [0.50, 0.25, 1024]

# --------------------------------------------------------------------------
# Lightweight Backbone
# --------------------------------------------------------------------------
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [16, 3, 2]]      # 0
  - [-1, 1, Conv, [32, 3, 2]]      # 1
  - [-1, 1, C2f,  [32, 1, True]]   # 2
  - [-1, 1, Conv, [64, 3, 2]]      # 3
  - [-1, 1, C2f,  [64, 1, True]]   # 4   -> neck
  - [-1, 1, Conv, [128, 3, 2]]     # 5
  - [-1, 1, C2f,  [128, 1, True]]  # 6
  - [-1, 1, SPPF, [128, 5]]        # 7   -> neck (deepest features)

# --------------------------------------------------------------------------
# Neck + Single-Scale Detection Head
# --------------------------------------------------------------------------
head:
  - [-1,      1, Conv,        [64, 1, 1]]             # 8
  - [-1,      1, nn.Upsample, [None, 2, "nearest"]]   # 9
  - [[-1, 4], 1, Concat,      [1]]                    # 10  concat with Layer 4
  - [-1,      1, C2f,         [64, 1, False]]          # 11

  - [[11],    1, Detect,      [nc]]                   # 12  single-scale Detect head
